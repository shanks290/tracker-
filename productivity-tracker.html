<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Productivity</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --bg:#ffffff;
    --surface:#fafafa;
    --border:#eeeeec;
    --border-strong:#c9c9c5;
    --ink:#111111;
    --ink-soft:#5c5c58;
    --ink-faint:#9a9a95;
    --track:#ebebe8;
    --mono:'IBM Plex Mono', monospace;
    --serif:'Fraunces', serif;
    --sans:'Inter', sans-serif;
    color-scheme: light;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);}
  .wrap{max-width:960px;margin:0 auto;padding:36px 28px 64px;}

  .header{
    display:flex;justify-content:space-between;align-items:flex-end;
    border-bottom:2px solid var(--ink); padding-bottom:14px; margin-bottom:6px;
    position:relative;
  }
  .header::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:1px;background:var(--ink);}
  .title-block .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--ink-faint);text-transform:uppercase;margin-bottom:6px;}
  .title-block h1{font-family:var(--serif);font-weight:700;font-size:30px;letter-spacing:.01em;margin:0;}
  .header-right{text-align:right;font-family:var(--mono);font-size:12px;color:var(--ink-soft);}
  .header-right .streak{font-size:20px;font-family:var(--serif);font-weight:600;color:var(--ink);}

  .grid{display:grid;grid-template-columns:1fr 1.3fr;gap:20px;margin-top:26px;}
  @media (max-width:720px){.grid{grid-template-columns:1fr;}}

  .card{background:var(--bg);padding:20px 22px 22px;}
  .card-title{
    display:flex;justify-content:space-between;align-items:center;
    font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);
    padding-bottom:10px;margin-bottom:14px;
  }
  .card-title .right-label{text-transform:none;letter-spacing:0;}

  .tabs{display:flex;border:1px solid var(--border-strong);border-radius:6px;overflow:hidden;}
  .tab{font-family:var(--sans);font-size:12px;font-weight:500;color:var(--ink-soft);padding:6px 12px;cursor:pointer;background:var(--bg);border:none;border-right:1px solid var(--border-strong);transition:background .15s, color .15s;}
  .tab:last-child{border-right:none;}
  .tab.active{background:var(--ink);color:#fff;}
  .tab:hover:not(.active){background:var(--surface);}

  .habit-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);gap:10px;}
  .habit-row:last-of-type{border-bottom:none;}
  .habit-left{display:flex;align-items:center;gap:9px;min-width:0;}
  .habit-left svg{width:17px;height:17px;flex-shrink:0;color:var(--ink);}
  .habit-left span{font-size:13.5px;color:var(--ink);white-space:nowrap;}
  .habit-right{display:flex;align-items:center;gap:10px;flex-shrink:0;}

  .hours-input{
    width:46px;font-family:var(--mono);font-size:12px;text-align:right;
    border:none;border-bottom:1.4px solid var(--border-strong);background:transparent;color:var(--ink);
    padding:2px 2px;outline:none;
  }
  .hours-input:focus{border-bottom-color:var(--ink);}
  .hours-input:disabled{color:var(--ink-soft);border-bottom-style:dotted;}
  .hours-suffix{font-family:var(--mono);font-size:11px;color:var(--ink-faint);margin-left:-6px;}

  .checkbox{width:19px;height:19px;border:1.6px solid var(--ink);border-radius:4px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:var(--bg);transition:background .12s;}
  .checkbox.checked{background:var(--ink);}
  .checkbox svg{width:11px;height:11px;color:#fff;opacity:0;transition:opacity .1s;}
  .checkbox.checked svg{opacity:1;}

  .today-progress{margin-top:16px;}
  .today-progress-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
  .today-progress-top .label{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--ink-soft);text-transform:uppercase;}
  .today-progress-top .pct{font-family:var(--serif);font-weight:700;font-size:22px;}
  .bar-track{height:6px;background:var(--track);border-radius:3px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--ink);border-radius:3px;transition:width .25s ease;}

  .chart-wrap{position:relative;}
  #chart-svg{width:100%;height:220px;display:block;overflow:visible;}
  .tooltip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-family:var(--mono);font-size:11px;padding:6px 9px;border-radius:5px;transform:translate(-50%,-115%);white-space:nowrap;opacity:0;transition:opacity .1s;z-index:5;}
  .tooltip.show{opacity:1;}

  .pie-wrap{display:flex;justify-content:center;padding:4px 0;}
  #pie-svg{width:100%;max-width:520px;height:auto;overflow:visible;}

  .legend-row{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:center;padding:10px 0 0;}
  .legend-item{display:flex;align-items:center;gap:6px;}
  .legend-swatch{width:10px;height:10px;border-radius:2.5px;flex-shrink:0;}
  .legend-item span{font-family:var(--sans);font-size:11.5px;color:var(--ink-soft);}

  .month-card{margin-top:8px;padding:20px 0 22px;}
  .month-eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:16px;text-align:center;}
  .rings-row{display:flex;flex-wrap:nowrap;justify-content:space-between;gap:8px;overflow-x:auto;padding-bottom:2px;}
  .ring-item{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1 1 0;min-width:56px;}
  .ring-svg-wrap{position:relative;width:58px;height:58px;flex-shrink:0;}
  .ring-svg-wrap svg.ring-bg{width:58px;height:58px;}
  .ring-svg-wrap svg.habit-mini-icon{width:18px;height:18px;color:var(--ink);position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);}
  .ring-pct{font-family:var(--mono);font-weight:600;font-size:12px;white-space:nowrap;}
  .ring-label{font-family:var(--sans);font-size:10.5px;color:var(--ink-soft);text-align:center;line-height:1.2;}

  .total-card{margin-top:8px;padding:20px 0 22px;}
  .total-top{display:flex;justify-content:space-between;margin-bottom:10px;}
  .total-top .label{font-family:var(--serif);font-weight:600;font-size:16px;}
  .total-top .pct{font-family:var(--mono);font-weight:600;font-size:16px;}
  .total-card .bar-track{height:16px;border-radius:8px;}
  .total-card .bar-fill{border-radius:8px;}

  .trend-card{margin-top:8px;}

  .footer{margin-top:20px;display:flex;justify-content:space-between;align-items:center;}
  .footer-note{font-family:var(--mono);font-size:11px;color:var(--ink-faint);}
  .reset-link{font-family:var(--mono);font-size:11px;color:var(--ink-soft);background:none;border:none;text-decoration:underline;cursor:pointer;}
  .reset-link:hover{color:var(--ink);}
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <div class="title-block">
      <div class="eyebrow">Daily practice</div>
      <h1>Productivity</h1>
    </div>
    <div class="header-right">
      <div id="header-date">—</div>
      <div class="streak" id="header-streak">0-day streak</div>
    </div>
  </div>

  <div class="grid">
    <div class="card">
      <div class="card-title"><span id="checklist-date-label">Today</span></div>
      <div id="habit-list"></div>
      <div class="today-progress">
        <div class="today-progress-top">
          <span class="label">Completed</span>
          <span class="pct" id="today-pct">0%</span>
        </div>
        <div class="bar-track"><div class="bar-fill" id="today-bar" style="width:0%"></div></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title"><span>Analytics</span><span class="right-label">Today</span></div>
      <div class="pie-wrap">
        <svg id="pie-svg" viewBox="0 0 520 380"></svg>
      </div>
      <div class="legend-row" id="legend-row"></div>
    </div>
  </div>

  <div class="card month-card">
    <div class="month-eyebrow">This month · per activity</div>
    <div class="rings-row" id="rings-row"></div>
  </div>

  <div class="card total-card">
    <div class="total-top">
      <span class="label">Total</span>
      <span class="pct" id="total-pct">0%</span>
    </div>
    <div class="bar-track"><div class="bar-fill" id="total-bar" style="width:0%"></div></div>
  </div>

  <div class="card trend-card">
    <div class="card-title">
      <span>Trend</span>
      <div class="tabs" id="period-tabs">
        <button class="tab" data-period="week">This Week</button>
        <button class="tab active" data-period="month">This Month</button>
        <button class="tab" data-period="full">Full Month</button>
      </div>
    </div>
    <div class="chart-wrap">
      <svg id="chart-svg" viewBox="0 0 900 220" preserveAspectRatio="none"></svg>
      <div class="tooltip" id="chart-tooltip"></div>
    </div>
  </div>

  <div class="footer">
    <div class="footer-note">Saved automatically as you go</div>
    <button class="reset-link" id="reset-btn">Reset all data</button>
  </div>

</div>

<script>
(function(){
  const HABITS = [
    { id:'studies', label:'Studies', icon: `<path d="M4 5C4 4.4 4.4 4 5 4H10C11.1 4 12 4.9 12 6V20C12 19 11.1 18 10 18H4V5Z" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linejoin="round"/><path d="M20 5C20 4.4 19.6 4 19 4H14C12.9 4 12 4.9 12 6V20C12 19 12.9 18 14 18H20V5Z" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linejoin="round"/>`, auto:false },
    { id:'workout', label:'Workout', icon: `<path d="M7 12h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><rect x="3.5" y="8.5" width="3" height="7" rx="1" stroke="currentColor" stroke-width="1.4" fill="none"/><rect x="17.5" y="8.5" width="3" height="7" rx="1" stroke="currentColor" stroke-width="1.4" fill="none"/><path d="M2 10.5v3M22 10.5v3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>`, auto:false },
    { id:'python', label:'Python', icon: `<path d="M9 8.5l-4.5 3.5L9 15.5M15 8.5l4.5 3.5L15 15.5" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`, auto:false },
    { id:'linux', label:'Linux', icon: `<rect x="3.5" y="4.5" width="17" height="15" rx="2" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M7 9.5l3.5 2.5L7 14.5M12.5 14.5H17" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`, auto:false },
    { id:'edit', label:'Edit', icon: `<path d="M12 20h9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linejoin="round"/>`, auto:false },
    { id:'content', label:'Content Creation', icon: `<rect x="3" y="7" width="18" height="13" rx="2" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M8 7l1.5-2.5h5L16 7" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linejoin="round"/><circle cx="12" cy="13.5" r="3.3" stroke="currentColor" stroke-width="1.5" fill="none"/>`, auto:false },
    { id:'gaming', label:'Gaming', icon: `<rect x="3" y="8" width="18" height="9" rx="4" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M7 11v3M5.5 12.5h3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="15" cy="11.3" r="1" fill="currentColor"/><circle cx="17.5" cy="13.3" r="1" fill="currentColor"/>`, auto:false },
    { id:'guitar', label:'Guitar', icon: `<circle cx="7" cy="18" r="2.3" stroke="currentColor" stroke-width="1.5" fill="none"/><circle cx="16" cy="16" r="2.3" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M9.3 18V6.5L18.3 5V16" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`, auto:false },
    { id:'sleep', label:'Sleep', icon: `<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linejoin="round"/>`, auto:false },
    { id:'other', label:'Other', icon: `<circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3,3" fill="none"/>`, auto:true }
  ];

  const CHECK_ICON = `<svg viewBox="0 0 24 24" fill="none"><path d="M4 12L9 17L20 6" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

  function grayPalette(n){
    const startL = 14, endL = 158;
    const arr = [];
    for(let i=0;i<n;i++){
      const v = Math.round(startL + (n>1 ? i*(endL-startL)/(n-1) : 0));
      const hex = v.toString(16).padStart(2,'0');
      arr.push(`#${hex}${hex}${hex}`);
    }
    return arr;
  }
  const GRAYS = grayPalette(HABITS.length);

  const pad = n => String(n).padStart(2,'0');
  const dateKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const todayDate = new Date();
  const todayKey = dateKey(todayDate);
  const DAY_HOURS = 24;

  let log = {};
  let period = 'month';

  function seededRand(seed){ let x = Math.sin(seed) * 10000; return x - Math.floor(x); }

  async function storageGet(key){
    try{
      if(typeof window.storage !== 'undefined' && window.storage) return await window.storage.get(key, false);
    }catch(e){}
    try{
      const v = localStorage.getItem(key);
      return v ? { key, value:v, shared:false } : null;
    }catch(e){ return null; }
  }
  async function storageSet(key, value){
    try{
      if(typeof window.storage !== 'undefined' && window.storage) return await window.storage.set(key, value, false);
    }catch(e){}
    try{ localStorage.setItem(key, value); return { key, value, shared:false }; }catch(e){ return null; }
  }

  function recalcOther(entry){
    let sum = 0;
    HABITS.forEach(h => { if(!h.auto) sum += (entry[h.id].hours || 0); });
    const other = HABITS.find(h => h.auto);
    entry[other.id].hours = Math.max(0, Math.round((DAY_HOURS - sum) * 10) / 10);
    return entry;
  }

  function blankEntry(){
    const e = {};
    HABITS.forEach(h => e[h.id] = { done:false, hours:0 });
    return recalcOther(e);
  }

  function ensureHabitsShape(entry){
    HABITS.forEach(h => { if(!entry[h.id]) entry[h.id] = { done:false, hours:0 }; });
    recalcOther(entry);
    return entry;
  }

  async function loadData(){
    try{
      const res = await storageGet('habitlog-v4');
      if(res && res.value){
        log = JSON.parse(res.value);
        Object.keys(log).forEach(k => ensureHabitsShape(log[k]));
        if(!log[todayKey]) log[todayKey] = blankEntry();
        await saveData();
        return;
      }

      // First time on the new (real-data-only) store: carry forward only
      // today's real entries from the old demo-seeded store, drop everything else.
      let todayCarry = null;
      try{
        const old = await storageGet('habitlog-v3');
        if(old && old.value){
          const oldLog = JSON.parse(old.value);
          if(oldLog[todayKey]) todayCarry = ensureHabitsShape(oldLog[todayKey]);
        }
      }catch(e){}

      log = { [todayKey]: todayCarry || blankEntry() };
      await saveData();
    }catch(e){
      log = { [todayKey]: blankEntry() };
    }
  }

  async function saveData(){
    try{ await storageSet('habitlog-v4', JSON.stringify(log)); }catch(e){}
  }

  function renderHeader(){
    const dateStr = todayDate.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric', year:'numeric' });
    document.getElementById('header-date').textContent = dateStr;
    document.getElementById('checklist-date-label').textContent = todayDate.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric' });
    let streak = 0, cursor = new Date(todayDate);
    while(true){
      const entry = log[dateKey(cursor)];
      if(entry && Object.values(entry).some(v => v.done)){ streak++; cursor.setDate(cursor.getDate()-1); } else break;
    }
    document.getElementById('header-streak').textContent = `${streak}-day streak`;
  }

  function renderChecklist(){
    const container = document.getElementById('habit-list');
    container.innerHTML = '';
    const entry = log[todayKey];
    HABITS.forEach(h => {
      const row = document.createElement('div');
      row.className = 'habit-row';
      row.innerHTML = `
        <div class="habit-left">
          <svg viewBox="0 0 24 24">${h.icon}</svg>
          <span>${h.label}</span>
        </div>
        <div class="habit-right">
          <input class="hours-input" type="number" min="0" max="24" step="0.5" value="${entry[h.id].hours || 0}" data-habit="${h.id}" ${h.auto ? 'disabled title="Calculated automatically"' : ''} />
          <span class="hours-suffix">h</span>
          <div class="checkbox ${entry[h.id].done ? 'checked' : ''}" data-habit="${h.id}">${CHECK_ICON}</div>
        </div>
      `;
      container.appendChild(row);
    });
    container.querySelectorAll('.checkbox').forEach(cb => {
      cb.addEventListener('click', async () => {
        const id = cb.dataset.habit;
        const habitDef = HABITS.find(h => h.id === id);
        const item = log[todayKey][id];
        item.done = !item.done;
        if(item.done && !habitDef.auto && (!item.hours || item.hours === 0)){
          item.hours = 1;
        }
        recalcOther(log[todayKey]);
        await saveData();
        renderAll();
      });
    });
    container.querySelectorAll('.hours-input:not(:disabled)').forEach(inp => {
      inp.addEventListener('change', async () => {
        const id = inp.dataset.habit;
        let v = parseFloat(inp.value);
        if(isNaN(v) || v < 0) v = 0;
        log[todayKey][id].hours = v;
        recalcOther(log[todayKey]);
        await saveData();
        renderChecklist();
        renderAnalytics();
      });
    });
    updateTodayProgress();
  }

  function updateTodayProgress(){
    const entry = log[todayKey];
    const checked = Object.values(entry).filter(v => v.done).length;
    const pct = Math.round((checked / HABITS.length) * 100);
    document.getElementById('today-pct').textContent = pct + '%';
    document.getElementById('today-bar').style.width = pct + '%';
  }

  function getPeriodDates(){
    const dates = [];
    if(period === 'week'){
      for(let i=6;i>=0;i--){ const d = new Date(todayDate); d.setDate(d.getDate()-i); dates.push(d); }
    } else if(period === 'month'){
      const d0 = new Date(todayDate.getFullYear(), todayDate.getMonth(), 1);
      for(let d=new Date(d0); d<=todayDate; d.setDate(d.getDate()+1)) dates.push(new Date(d));
    } else {
      const keys = Object.keys(log).sort();
      if(keys.length){
        let cur = new Date(keys[0]);
        while(cur <= todayDate){ dates.push(new Date(cur)); cur.setDate(cur.getDate()+1); }
      }
    }
    return dates;
  }

  function renderChart(){
    const dates = getPeriodDates();
    const points = dates.map(d => {
      const entry = log[dateKey(d)] || {};
      const vals = Object.values(entry);
      const checked = vals.filter(v => v.done).length;
      const pct = vals.length ? Math.round((checked/HABITS.length)*100) : 0;
      return { date:d, pct };
    });

    const svg = document.getElementById('chart-svg');
    const W = 900, H = 220, padL = 40, padR = 14, padT = 16, padB = 28;
    const innerW = W - padL - padR, innerH = H - padT - padB;

    if(points.length === 0){
      svg.innerHTML = `<text x="${W/2}" y="${H/2}" text-anchor="middle" font-family="Inter" font-size="13" fill="#9a9a95">No data yet</text>`;
      return;
    }

    const xStep = points.length > 1 ? innerW / (points.length - 1) : 0;
    const yFor = pct => padT + innerH - (pct/100)*innerH;
    const xFor = i => padL + i*xStep;

    let gridLines = '';
    [0,25,50,75,100].forEach(v => {
      const y = yFor(v);
      gridLines += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="#ececea" stroke-width="1" stroke-dasharray="${v===0?'0':'3,4'}"/>`;
      gridLines += `<text x="${padL-8}" y="${y+3}" text-anchor="end" font-family="IBM Plex Mono" font-size="9" fill="#9a9a95">${v}%</text>`;
    });

    let linePath = '';
    points.forEach((p,i) => { const x = xFor(i), y = yFor(p.pct); linePath += (i===0 ? `M${x},${y}` : ` L${x},${y}`); });
    const areaPath = linePath + ` L${xFor(points.length-1)},${padT+innerH} L${xFor(0)},${padT+innerH} Z`;

    let dots = '';
    points.forEach((p,i) => { const x = xFor(i), y = yFor(p.pct); dots += `<circle cx="${x}" cy="${y}" r="3" fill="#111111" class="chart-dot" data-i="${i}"/>`; });

    let xLabels = '';
    const labelEvery = Math.max(1, Math.ceil(points.length/9));
    points.forEach((p,i) => {
      if(i % labelEvery === 0 || i === points.length-1){
        xLabels += `<text x="${xFor(i)}" y="${H-8}" text-anchor="middle" font-family="IBM Plex Mono" font-size="9" fill="#9a9a95">${p.date.getMonth()+1}/${p.date.getDate()}</text>`;
      }
    });

    svg.innerHTML = `${gridLines}<path d="${areaPath}" fill="#111111" opacity="0.06" stroke="none"/><path d="${linePath}" fill="none" stroke="#111111" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${dots}${xLabels}`;

    const tooltip = document.getElementById('chart-tooltip');
    svg.querySelectorAll('.chart-dot').forEach(dot => {
      dot.addEventListener('mouseenter', () => {
        const i = +dot.dataset.i, p = points[i];
        const rect = svg.getBoundingClientRect();
        const cx = parseFloat(dot.getAttribute('cx')), cy = parseFloat(dot.getAttribute('cy'));
        const scaleX = rect.width / W, scaleY = rect.height / H;
        tooltip.style.left = (cx*scaleX) + 'px';
        tooltip.style.top = (cy*scaleY) + 'px';
        tooltip.textContent = `${p.date.toLocaleDateString('en-US',{month:'short',day:'numeric'})} · ${p.pct}%`;
        tooltip.classList.add('show');
        dot.setAttribute('r','4.5');
      });
      dot.addEventListener('mouseleave', () => { tooltip.classList.remove('show'); dot.setAttribute('r','3'); });
    });
  }

  function renderPie(){
    const entry = log[todayKey];
    const slices = HABITS.map((h,i) => ({ id:h.id, label:h.label, hours: entry[h.id].hours || 0, color: GRAYS[i] }))
      .filter(it => it.hours > 0);

    const svg = document.getElementById('pie-svg');
    const cx = 220, cy = 190, r = 100;

    if(slices.length === 0){
      svg.innerHTML = `<text x="${cx}" y="${cy}" text-anchor="middle" font-family="Inter" font-size="13" fill="#9a9a95">Log hours below to see today's split</text>`;
      renderLegend([]);
      return;
    }

    const total = slices.reduce((s,it)=>s+it.hours,0);    let angle = -Math.PI/2;
    let wedges = '', insideLabels = '';
    const rawLabels = [];
    const darkColors = new Set(GRAYS.slice(0, Math.ceil(GRAYS.length/2)));

    slices.forEach(sl => {
      const frac = sl.hours / total;
      const start = angle;
      const end = angle + frac * Math.PI * 2;
      const large = (end - start) > Math.PI ? 1 : 0;
      const x1 = cx + r*Math.cos(start), y1 = cy + r*Math.sin(start);
      const x2 = cx + r*Math.cos(end), y2 = cy + r*Math.sin(end);
      if(slices.length === 1){
        wedges += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${sl.color}" stroke="#ffffff" stroke-width="2"/>`;
      } else {
        wedges += `<path d="M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${large} 1 ${x2},${y2} Z" fill="${sl.color}" stroke="#ffffff" stroke-width="2"/>`;
      }

      const mid = (start+end)/2;
      const pct = Math.round(frac*100);

      if(pct >= 7){
        const ix = cx + r*0.62*Math.cos(mid), iy = cy + r*0.62*Math.sin(mid);
        const textColor = darkColors.has(sl.color) ? '#ffffff' : '#111111';
        insideLabels += `<text x="${ix}" y="${iy}" text-anchor="middle" dominant-baseline="middle" font-family="IBM Plex Mono" font-size="13" font-weight="600" fill="${textColor}">${pct}%</text>`;
      }

      const cosM = Math.cos(mid), sinM = Math.sin(mid);
      const dir = cosM >= 0 ? 1 : -1;
      rawLabels.push({
        edgeX: cx + (r+2)*cosM, edgeY: cy + (r+2)*sinM,
        rawY: cy + (r+22)*sinM,
        dir, hours: sl.hours, label: sl.label
      });

      angle = end;
    });

    const minGap = 34;
    [1,-1].forEach(dir => {
      const group = rawLabels.filter(l => l.dir === dir).sort((a,b) => a.rawY - b.rawY);
      for(let i=1;i<group.length;i++){
        if(group[i].rawY < group[i-1].rawY + minGap) group[i].rawY = group[i-1].rawY + minGap;
      }
      if(group.length){
        const first = group[0].rawY, last = group[group.length-1].rawY;
        const shift = cy - (first+last)/2;
        group.forEach(l => l.rawY += shift);
      }
    });

    let leaders = '';
    rawLabels.forEach(l => {
      const elbowX = cx + l.dir*(r+18);
      const labelAnchorX = cx + l.dir*(r+40);
      const anchor = l.dir === 1 ? 'start' : 'end';
      const hrsLabel = `${l.hours}h`;
      leaders += `<path d="M${l.edgeX},${l.edgeY} L${elbowX},${l.rawY} L${labelAnchorX},${l.rawY}" fill="none" stroke="#c9c9c5" stroke-width="1"/>`;
      leaders += `<text x="${labelAnchorX + l.dir*4}" y="${l.rawY-3}" text-anchor="${anchor}" font-family="IBM Plex Mono" font-size="11" font-weight="600" fill="#111111">${hrsLabel}</text>`;
      leaders += `<text x="${labelAnchorX + l.dir*4}" y="${l.rawY+10}" text-anchor="${anchor}" font-family="Inter" font-size="9.5" fill="#9a9a95">${l.label}</text>`;
    });

    svg.innerHTML = wedges + insideLabels + leaders;
    renderLegend(slices);
  }

  function renderLegend(slices){
    const container = document.getElementById('legend-row');
    container.innerHTML = '';
    slices.forEach(sl => {
      const item = document.createElement('div');
      item.className = 'legend-item';
      item.innerHTML = `<span class="legend-swatch" style="background:${sl.color}"></span><span>${sl.label}</span>`;
      container.appendChild(item);
    });
  }

  function ringSvg(pct){
    const r = 22, c = 2*Math.PI*r;
    const offset = c * (1 - pct/100);
    return `
      <svg class="ring-bg" viewBox="0 0 52 52">
        <circle cx="26" cy="26" r="${r}" stroke="#ececea" stroke-width="5" fill="none"/>
        <circle cx="26" cy="26" r="${r}" stroke="#111111" stroke-width="5" fill="none"
          stroke-dasharray="${c}" stroke-dashoffset="${offset}" stroke-linecap="round"
          transform="rotate(-90 26 26)"/>
      </svg>`;
  }

  function monthlyPct(habitId){
    const d0 = new Date(todayDate.getFullYear(), todayDate.getMonth(), 1);
    let checked = 0, total = 0;
    for(let d = new Date(d0); d <= todayDate; d.setDate(d.getDate()+1)){
      const entry = log[dateKey(d)];
      total++;
      if(entry && entry[habitId] && entry[habitId].done) checked++;
    }
    return total ? Math.round((checked/total)*100) : 0;
  }

  function renderMonthlyRings(){
    const container = document.getElementById('rings-row');
    container.innerHTML = '';
    HABITS.forEach(h => {
      const pct = monthlyPct(h.id);
      const item = document.createElement('div');
      item.className = 'ring-item';
      item.innerHTML = `
        <div class="ring-svg-wrap">
          ${ringSvg(pct)}
          <svg class="habit-mini-icon" viewBox="0 0 24 24">${h.icon}</svg>
        </div>
        <div class="ring-pct">${pct}%</div>
        <div class="ring-label">${h.label}</div>
      `;
      container.appendChild(item);
    });
  }

  function renderAnalytics(){
    renderPie();
    renderMonthlyRings();
    const entry = log[todayKey];
    const checked = Object.values(entry).filter(v => v.done).length;
    const pct = Math.round((checked/HABITS.length)*100);
    document.getElementById('total-pct').textContent = pct + '%';
    document.getElementById('total-bar').style.width = pct + '%';
  }

  function renderAll(){ renderHeader(); renderChecklist(); renderChart(); renderAnalytics(); }

  document.getElementById('period-tabs').addEventListener('click', (e) => {
    const btn = e.target.closest('.tab'); if(!btn) return;
    period = btn.dataset.period;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    renderChart();
  });

  document.getElementById('reset-btn').addEventListener('click', async () => {
    if(!confirm('Reset all tracked data? This cannot be undone.')) return;
    log = { [todayKey]: blankEntry() };
    await saveData();
    renderAll();
  });

  (async function init(){ await loadData(); renderAll(); })();
})();
</script>
</body>
</html>
